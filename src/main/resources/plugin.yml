name: TidyShop
version: '${version}'
main: cz.mmartis.tidyshop.TidyShopPlugin
api-version: '26.3'
author: mmartis
description: Chest GUI shop for Vault economies.
depend: [Vault]

permissions:
  tidyshop.use:
    description: Open the shop (/shop).
    default: true
  tidyshop.admin:
    description: Reload the configuration (/shop reload).
    default: op
